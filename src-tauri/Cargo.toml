[package]
name = "librik"
version = "0.1.0"
description = "Librik desktop shell"
authors = ["Librik"]
edition = "2021"

[lib]
name = "librik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
